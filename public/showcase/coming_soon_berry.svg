<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 1100" width="100%" height="100%">
  <defs>
    <radialGradient id="berryGlow" cx="50%" cy="42%" r="50%">
      <stop offset="0%" stop-color="#EC4899" stop-opacity="0.45"/>
      <stop offset="45%" stop-color="#EC4899" stop-opacity="0.12"/>
      <stop offset="100%" stop-color="#0B0F15" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#20131B"/>
      <stop offset="50%" stop-color="#160D13"/>
      <stop offset="100%" stop-color="#0B070A"/>
    </linearGradient>
    <linearGradient id="bagBorder" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#F472B6" stop-opacity="0.8"/>
      <stop offset="50%" stop-color="#F472B6" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#F472B6" stop-opacity="0.5"/>
    </linearGradient>
    <filter id="neonBlur" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="18" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Background Base -->
  <rect width="800" height="1100" fill="url(#bgGrad)"/>

  <!-- Tech Grid Lines -->
  <g stroke="#ffffff" stroke-opacity="0.04" stroke-width="1">
    <line x1="80" y1="0" x2="80" y2="1100"/>
    <line x1="200" y1="0" x2="200" y2="1100"/>
    <line x1="400" y1="0" x2="400" y2="1100"/>
    <line x1="600" y1="0" x2="600" y2="1100"/>
    <line x1="720" y1="0" x2="720" y2="1100"/>
    <line x1="0" y1="180" x2="800" y2="180"/>
    <line x1="0" y1="360" x2="800" y2="360"/>
    <line x1="0" y1="550" x2="800" y2="550"/>
    <line x1="0" y1="740" x2="800" y2="740"/>
    <line x1="0" y1="920" x2="800" y2="920"/>
  </g>

  <!-- Ambient Radiant Glow -->
  <circle cx="400" cy="480" r="380" fill="url(#berryGlow)"/>

  <!-- Top Status Badge -->
  <g transform="translate(400, 110)">
    <rect x="-105" y="-22" width="210" height="44" rx="22" fill="#EC4899" fill-opacity="0.15" stroke="#EC4899" stroke-width="1.5"/>
    <circle cx="-75" cy="0" r="5" fill="#F472B6">
      <animate attributeName="opacity" values="1;0.3;1" dur="2s" repeatCount="indefinite"/>
    </circle>
    <text x="-58" y="6" fill="#F472B6" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-weight="800" font-size="14" letter-spacing="2.5">COMING SOON</text>
  </g>

  <!-- Mystery Product Silhouette Bag -->
  <g transform="translate(240, 240)">
    <rect x="0" y="0" width="320" height="460" rx="36" fill="#EC4899" fill-opacity="0.08" filter="url(#neonBlur)"/>
    <rect x="0" y="0" width="320" height="460" rx="36" fill="#1C1017" fill-opacity="0.75" stroke="url(#bagBorder)" stroke-width="2" stroke-dasharray="10 6"/>

    <!-- Bag Handle Slot -->
    <rect x="100" y="30" width="120" height="32" rx="16" fill="#10090E" stroke="#F472B6" stroke-opacity="0.4" stroke-width="1.5"/>

    <!-- Cat Silhouette with glowing eyes -->
    <g transform="translate(160, 240)">
      <path d="M-55,-10 L-65,-60 L-25,-35 Q0,-42 25,-35 L65,-60 L55,-10 Q70,30 0,45 Q-70,30 -55,-10 Z" fill="#0E080C" stroke="#F472B6" stroke-opacity="0.5" stroke-width="1.5"/>
      <!-- Glowing Cat Eyes (Rose Pink) -->
      <ellipse cx="-24" cy="-5" rx="9" ry="12" fill="#F472B6" filter="url(#neonBlur)"/>
      <ellipse cx="-24" cy="-5" rx="7" ry="10" fill="#FDF2F8"/>
      <ellipse cx="-22" cy="-5" rx="3" ry="8" fill="#831843"/>

      <ellipse cx="24" cy="-5" rx="9" ry="12" fill="#F472B6" filter="url(#neonBlur)"/>
      <ellipse cx="24" cy="-5" rx="7" ry="10" fill="#FDF2F8"/>
      <ellipse cx="26" cy="-5" rx="3" ry="8" fill="#831843"/>

      <polygon points="0,10 -5,4 5,4" fill="#F472B6"/>
    </g>

    <text x="160" y="165" fill="#F472B6" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-weight="900" font-size="52" text-anchor="middle" fill-opacity="0.35">?</text>

    <!-- Lab Code -->
    <text x="160" y="380" fill="#ffffff" fill-opacity="0.35" font-family="monospace" font-size="12" letter-spacing="3" text-anchor="middle">FORMULA: MEOW-05</text>
    <text x="160" y="405" fill="#F472B6" fill-opacity="0.8" font-family="monospace" font-weight="700" font-size="13" letter-spacing="2" text-anchor="middle">WILD CRANBERRY EXTRACT</text>
  </g>

  <!-- Title & Flavor Info -->
  <g transform="translate(400, 800)" text-anchor="middle">
    <text y="0" fill="#FFFFFF" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-weight="900" font-size="44" letter-spacing="-0.5">BERRY FRESH</text>
    <text y="42" fill="#F472B6" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-weight="700" font-size="18" letter-spacing="4">TOFU CAT LITTER</text>
    <text y="82" fill="#ffffff" fill-opacity="0.5" font-family="system-ui, sans-serif" font-size="14" letter-spacing="1">Sweet antioxidant berries &amp; natural clumping</text>

    <g transform="translate(0, 140)">
      <rect x="-110" y="-18" width="220" height="36" rx="18" fill="#ffffff" fill-opacity="0.06" stroke="#ffffff" stroke-opacity="0.15"/>
      <text y="5" fill="#FFFFFF" fill-opacity="0.8" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-weight="700" font-size="13" letter-spacing="1.5">DROP 04 • WINTER '26</text>
    </g>
  </g>
</svg>
